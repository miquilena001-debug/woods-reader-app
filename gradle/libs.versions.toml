[versions]
# ── Core ────────────────────────────────────────────────────────────────────
agp                    = "8.9.1"     # Requiere que core-ktx 1.17.0 funcione con compileSdk 35
kotlin                 = "2.0.21"
ksp                    = "2.0.21-1.0.28"
# ── AndroidX ──────────────────────────────────────────────────────────────────────
coreKtx                = "1.17.0"    # Requiere AGP 8.9.1+ (actualizado arriba)
activityCompose        = "1.10.1"     # Compatible con AGP 8.7.0 + compileSdk 35
lifecycleRuntimeKtx    = "2.8.7"
lifecycleViewmodel     = "2.8.7"
# ── Compose ─────────────────────────────────────────────────────────────────
composeBom             = "2024.09.00"
navigationCompose      = "2.8.7"
# ── DI ──────────────────────────────────────────────────────────────────────
hilt                   = "2.52"
hiltNavigationCompose  = "1.2.0"
# ── DB / Prefs ──────────────────────────────────────────────────────────────
room                   = "2.7.0"
datastore              = "1.1.1"
protobuf               = "4.28.0"
# ── Serialization ───────────────────────────────────────────────────────────
kotlinxSerialization   = "1.7.3"
# ── Readium ─────────────────────────────────────────────────────────────────
readium                = "3.0.3"
# ── TTS ─────────────────────────────────────────────────────────────────────
sherpaOnnx             = "1.10.30"   # JitPack: com.github.k2-fsa:sherpa-onnx-android
# ── AI ──────────────────────────────────────────────────────────────────────
kotlinllamacpp         = "0.1.3"    # JitPack 0.1.3 (compatible con Kotlin 2.0.21)
# ── Media ───────────────────────────────────────────────────────────────────
media3                 = "1.4.1"
# ── Images ──────────────────────────────────────────────────────────────────
coil                   = "3.0.4"
# ── Async / Workers ─────────────────────────────────────────────────────────
paging                 = "3.3.0"
workmanager            = "2.9.1"
# ── Parsing ─────────────────────────────────────────────────────────────────
pdfbox                 = "2.0.27.0"
junrar                 = "7.5.5"
jsoup                  = "1.18.1"
commonmark             = "0.22.0"
# ── Charts ──────────────────────────────────────────────────────────────────
vico                   = "2.0.0-alpha.20"
# ── Desugaring ──────────────────────────────────────────────────────────────
desugar                = "2.1.2"
# ── Logging ─────────────────────────────────────────────────────────────────
timber                 = "5.0.1"
haze                   = "1.1.1"
# ── Test ────────────────────────────────────────────────────────────────────
junit                  = "4.13.2"
junitVersion           = "1.3.0"
espressoCore           = "3.7.0"
kotlinxCoroutinesTest  = "1.10.2"
coreTest               = "1.6.1"
runner                 = "1.6.2"
collection             = "1.4.5"
mockk                  = "1.13.12"
turbine                = "1.1.0"

[libraries]
# ── AndroidX Core ────────────────────────────────────────────────────────────
androidx-core-ktx                    = { group = "androidx.core",               name = "core-ktx",                     version.ref = "coreKtx" }
androidx-activity-compose            = { group = "androidx.activity",            name = "activity-compose",             version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx       = { group = "androidx.lifecycle",           name = "lifecycle-runtime-ktx",        version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle",           name = "lifecycle-viewmodel-compose",  version.ref = "lifecycleViewmodel" }
androidx-lifecycle-runtime-compose   = { group = "androidx.lifecycle",           name = "lifecycle-runtime-compose",    version.ref = "lifecycleViewmodel" }
androidx-lifecycle-process           = { group = "androidx.lifecycle",           name = "lifecycle-process",            version.ref = "lifecycleRuntimeKtx" }
androidx-collection                  = { group = "androidx.collection",          name = "collection",                   version.ref = "collection" }
androidx-collection-ktx              = { group = "androidx.collection",          name = "collection-ktx",               version.ref = "collection" }
# ── Compose ──────────────────────────────────────────────────────────────────
androidx-compose-bom                 = { group = "androidx.compose",             name = "compose-bom",                  version.ref = "composeBom" }
androidx-compose-ui                  = { group = "androidx.compose.ui",          name = "ui" }
androidx-compose-ui-graphics         = { group = "androidx.compose.ui",          name = "ui-graphics" }
androidx-compose-ui-tooling-preview  = { group = "androidx.compose.ui",          name = "ui-tooling-preview" }
androidx-compose-ui-tooling          = { group = "androidx.compose.ui",          name = "ui-tooling" }
androidx-compose-ui-test-manifest    = { group = "androidx.compose.ui",          name = "ui-test-manifest" }
androidx-compose-ui-test-junit4      = { group = "androidx.compose.ui",          name = "ui-test-junit4" }
androidx-compose-material3           = { group = "androidx.compose.material3",   name = "material3" }
androidx-compose-material-icons-core = { group = "androidx.compose.material",    name = "material-icons-core" }
androidx-compose-material-icons-ext  = { group = "androidx.compose.material",    name = "material-icons-extended" }
androidx-navigation-compose          = { group = "androidx.navigation",          name = "navigation-compose",           version.ref = "navigationCompose" }
androidx-compose-ui-viewbinding      = { group = "androidx.compose.ui",          name = "ui-viewbinding" }
# ── Hilt ─────────────────────────────────────────────────────────────────────
hilt-android                         = { group = "com.google.dagger",            name = "hilt-android",                 version.ref = "hilt" }
hilt-compiler                        = { group = "com.google.dagger",            name = "hilt-android-compiler",        version.ref = "hilt" }
hilt-navigation-compose              = { group = "androidx.hilt",                name = "hilt-navigation-compose",      version.ref = "hiltNavigationCompose" }
hilt-work                            = { group = "androidx.hilt",                name = "hilt-work",                    version.ref = "hiltNavigationCompose" }
hilt-work-compiler                   = { group = "androidx.hilt",                name = "hilt-compiler",                version.ref = "hiltNavigationCompose" }
# ── Room ─────────────────────────────────────────────────────────────────────
androidx-room-runtime                = { group = "androidx.room",                name = "room-runtime",                 version.ref = "room" }
androidx-room-ktx                    = { group = "androidx.room",                name = "room-ktx",                     version.ref = "room" }
androidx-room-paging                 = { group = "androidx.room",                name = "room-paging",                  version.ref = "room" }
androidx-room-compiler               = { group = "androidx.room",                name = "room-compiler",                version.ref = "room" }
# ── DataStore Proto ───────────────────────────────────────────────────────────
androidx-datastore                   = { group = "androidx.datastore",           name = "datastore",                    version.ref = "datastore" }
protobuf-kotlin-lite                 = { group = "com.google.protobuf",          name = "protobuf-kotlin-lite",         version.ref = "protobuf" }
# ── Serialization ─────────────────────────────────────────────────────────────
kotlinx-serialization-json           = { group = "org.jetbrains.kotlinx",       name = "kotlinx-serialization-json",   version.ref = "kotlinxSerialization" }
# ── Readium ───────────────────────────────────────────────────────────────────
readium-shared                       = { group = "org.readium.kotlin-toolkit",   name = "readium-shared",               version.ref = "readium" }
readium-streamer                     = { group = "org.readium.kotlin-toolkit",   name = "readium-streamer",             version.ref = "readium" }
readium-navigator                    = { group = "org.readium.kotlin-toolkit",   name = "readium-navigator",            version.ref = "readium" }
readium-tts                          = { group = "org.readium.kotlin-toolkit",   name = "readium-navigator-media-tts",  version.ref = "readium" }
readium-pdfium                       = { group = "org.readium.kotlin-toolkit",   name = "readium-adapter-pdfium",       version.ref = "readium" }
# ── TTS (sherpa-onnx) — AAR local descargado de GitHub Releases ──────────────
# Descargar: github.com/k2-fsa/sherpa-onnx/releases → sherpa-onnx-{version}.aar
# Colocar en: app/libs/sherpa-onnx.aar
# NOTA: Se agrega como: implementation(files("libs/sherpa-onnx.aar")) en build.gradle.kts
# sherpa-onnx no tiene coordenadas válidas en JitPack/MavenCentral (retorna 401)
# ── AI Local — Maven Central (cambió de JitPack en v0.2.0) ────────────────────
kotlinllamacpp = { module = "com.github.ljcamargo:kotlinllamacpp", version.ref = "kotlinllamacpp" }
# ── Media3 ───────────────────────────────────────────────────────────────────
media3-exoplayer                     = { group = "androidx.media3",              name = "media3-exoplayer",             version.ref = "media3" }
media3-session                       = { group = "androidx.media3",              name = "media3-session",               version.ref = "media3" }
media3-ui                            = { group = "androidx.media3",              name = "media3-ui",                    version.ref = "media3" }
# ── Coil 3 ───────────────────────────────────────────────────────────────────
coil-compose                         = { group = "io.coil-kt.coil3",             name = "coil-compose",                 version.ref = "coil" }
coil-okhttp                          = { group = "io.coil-kt.coil3",             name = "coil-network-okhttp",          version.ref = "coil" }
# ── Paging 3 ─────────────────────────────────────────────────────────────────
androidx-paging-runtime              = { group = "androidx.paging",              name = "paging-runtime",               version.ref = "paging" }
androidx-paging-compose              = { group = "androidx.paging",              name = "paging-compose",               version.ref = "paging" }
# ── WorkManager ──────────────────────────────────────────────────────────────
androidx-work-runtime-ktx            = { group = "androidx.work",                name = "work-runtime-ktx",             version.ref = "workmanager" }
# ── Parsing ──────────────────────────────────────────────────────────────────
pdfbox-android                       = { module = "com.tom-roush:pdfbox-android", version.ref = "pdfbox" }
junrar                               = { group = "com.github.junrar",            name = "junrar",                       version.ref = "junrar" }
jsoup                                = { group = "org.jsoup",                    name = "jsoup",                        version.ref = "jsoup" }
commonmark                           = { group = "org.commonmark",               name = "commonmark",                   version.ref = "commonmark" }
commonmark-gfm-tables                = { group = "org.commonmark",               name = "commonmark-ext-gfm-tables",    version.ref = "commonmark" }
# ── Charts ───────────────────────────────────────────────────────────────────
vico-compose-m3                      = { group = "com.patrykandpatrick.vico",    name = "compose-m3",                   version.ref = "vico" }
# ── Desugaring ───────────────────────────────────────────────────────────────
desugar-jdk-libs                     = { group = "com.android.tools",            name = "desugar_jdk_libs",             version.ref = "desugar" }
# ── Logging ──────────────────────────────────────────────────────────────────
timber                               = { group = "com.jakewharton.timber",       name = "timber",                       version.ref = "timber" }
haze                                 = { group = "dev.chrisbanes.haze",          name = "haze",                         version.ref = "haze" }
# ── OkHttp (para ModelDownloadManager) ───────────────────────────────────────
okhttp                               = { group = "com.squareup.okhttp3",         name = "okhttp",                       version = "4.12.0" }
# ── Test ─────────────────────────────────────────────────────────────────────
junit                                = { group = "junit",                        name = "junit",                        version.ref = "junit" }
androidx-junit                       = { group = "androidx.test.ext",            name = "junit",                        version.ref = "junitVersion" }
androidx-espresso-core               = { group = "androidx.test.espresso",       name = "espresso-core",                version.ref = "espressoCore" }
kotlinx-coroutines-test              = { group = "org.jetbrains.kotlinx",        name = "kotlinx-coroutines-test",      version.ref = "kotlinxCoroutinesTest" }
androidx-test-core                   = { group = "androidx.test",                name = "core",                         version.ref = "coreTest" }
androidx-test-runner                 = { group = "androidx.test",                name = "runner",                       version.ref = "runner" }
mockk                                = { group = "io.mockk",                     name = "mockk",                        version.ref = "mockk" }
turbine                              = { group = "app.cash.turbine",             name = "turbine",                      version.ref = "turbine" }

[plugins]
android-application      = { id = "com.android.application",             version.ref = "agp" }
android-library          = { id = "com.android.library",                 version.ref = "agp" }
kotlin-android           = { id = "org.jetbrains.kotlin.android",        version.ref = "kotlin" }
kotlin-compose           = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization     = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt                     = { id = "com.google.dagger.hilt.android",      version.ref = "hilt" }
ksp                      = { id = "com.google.devtools.ksp",             version.ref = "ksp" }


